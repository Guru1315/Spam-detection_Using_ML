<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam Mail Detector</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#1f2937;display:flex;justify-content:center;padding:24px}
  .card{background:#fff;max-width:640px;width:100%;border-radius:14px;padding:28px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{margin:0 0 4px;font-size:26px}
  .sub{color:#6b7280;font-size:14px;margin-bottom:18px}
  select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin-bottom:12px}
  textarea{min-height:150px;resize:vertical}
  button{padding:10px 20px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-right:8px}
  #detect{background:#2563eb;color:#fff} #clear{background:#e5e7eb}
  button:disabled{opacity:.5;cursor:wait}
  #result{margin-top:20px;padding:16px;border-radius:10px;display:none}
  #result.spam{background:#fee2e2;color:#991b1b;display:block}
  #result.ham{background:#dcfce7;color:#166534;display:block}
  #result h2{margin:0 0 6px;font-size:22px}
  .bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar div{height:100%;background:#dc2626}
  details{margin-top:22px;font-size:14px;color:#374151}
  table{border-collapse:collapse;margin-top:8px} td,th{border:1px solid #e5e7eb;padding:6px 12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>📧 Spam Mail Detector</h1>
  <div class="sub" id="status">Loading model...</div>

  <select id="examples">
    <option value="">Try an example...</option>
    <option>Hey, are we still on for lunch tomorrow? Let me know.</option>
    <option>URGENT! You have won a 1 week FREE membership in our £100,000 Prize Jackpot! Txt the word: CLAIM to No: 81010</option>
    <option>Please review the attached project proposal for Q3 and provide your feedback by Friday.</option>
    <option>Congratulations! You've been selected for a free $500 Amazon Gift Card. Click here to claim your reward now!!</option>
    <option>Can you pick up some milk on your way home?</option>
  </select>
  <textarea id="msg" placeholder="Paste your email or SMS text here..."></textarea>
  <button id="detect" disabled>Detect</button><button id="clear">Clear</button>

  <div id="result"><h2 id="label"></h2><div id="detail"></div><div class="bar"><div id="fill"></div></div></div>

  <details>
    <summary>Model performance</summary>
    <p id="perf"></p>
    <table id="cm"></table>
  </details>
</div>

<script>
let M = null;

function tokenize(text){
  // same as scikit-learn's default token pattern: 2+ word characters
  return (text.toLowerCase().match(/[\p{L}\p{N}_]{2,}/gu)) || [];
}

function predict(text){
  const counts = {};
  for (const t of tokenize(text)){
    const i = M.vocab[t];
    if (i !== undefined) counts[i] = (counts[i] || 0) + 1;
  }
  // TF-IDF + L2 normalisation
  let norm = 0;
  const w = {};
  for (const i in counts){ w[i] = counts[i] * M.idf[i]; norm += w[i]*w[i]; }
  norm = Math.sqrt(norm) || 1;
  // Multinomial Naive Bayes
  const s = [M.log_prior[0], M.log_prior[1]];
  for (const i in w){
    const v = w[i] / norm;
    s[0] += v * M.log_prob[0][i];
    s[1] += v * M.log_prob[1][i];
  }
  const mx = Math.max(s[0], s[1]);
  const e0 = Math.exp(s[0]-mx), e1 = Math.exp(s[1]-mx);
  return { ham: e0/(e0+e1), spam: e1/(e0+e1) };
}

fetch("model.json")
  .then(r => { if(!r.ok) throw new Error("model.json not found"); return r.json(); })
  .then(m => {
    M = m;
    document.getElementById("status").textContent = "Machine learning model ready (TF-IDF + Naive Bayes)";
    document.getElementById("detect").disabled = false;
    document.getElementById("perf").textContent =
      `Accuracy: ${(m.accuracy*100).toFixed(2)}% — trained on ${m.train_size} messages, tested on ${m.test_size}.`;
    const c = m.confusion;
    document.getElementById("cm").innerHTML =
      `<tr><th></th><th>Predicted Ham</th><th>Predicted Spam</th></tr>
       <tr><th>Actual Ham</th><td>${c[0][0]}</td><td>${c[0][1]}</td></tr>
       <tr><th>Actual Spam</th><td>${c[1][0]}</td><td>${c[1][1]}</td></tr>`;
  })
  .catch(err => { document.getElementById("status").textContent = "Could not load model: " + err.message; });

document.getElementById("examples").onchange = e => { document.getElementById("msg").value = e.target.value; };

document.getElementById("detect").onclick = () => {
  const text = document.getElementById("msg").value.trim();
  if (!text){ alert("Please enter a message first."); return; }
  const p = predict(text);
  const isSpam = p.spam > p.ham;
  const r = document.getElementById("result");
  r.className = isSpam ? "spam" : "ham";
  document.getElementById("label").textContent = isSpam ? "🚨 SPAM" : "✅ NOT SPAM (Ham)";
  document.getElementById("detail").textContent =
    `Spam probability: ${(p.spam*100).toFixed(1)}%  |  Ham probability: ${(p.ham*100).toFixed(1)}%`;
  document.getElementById("fill").style.width = (p.spam*100) + "%";
};

document.getElementById("clear").onclick = () => {
  document.getElementById("msg").value = "";
  document.getElementById("examples").value = "";
  document.getElementById("result").className = "";
};
</script>
</body>
</html>
